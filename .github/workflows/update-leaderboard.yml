name: Update leaderboard

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch leaderboard
        run: |
          python3 fetch.py --update

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leaderboard-live.json data/version.txt data/meta.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update leaderboard $(cat data/version.txt)"
            git push
          fi

